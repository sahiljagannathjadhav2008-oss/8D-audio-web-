<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8D Audio Demo</title>
<style>
body{font-family:Arial;margin:0;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#1f1f1f;padding:20px;border-radius:14px;width:340px}
button,input{width:100%;margin:8px 0}
button{padding:12px;border:2px solid #4af;background:#222;color:#fff;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h2>8D Audio Demo</h2>
<input id="file" type="file" accept="audio/*">
<button onclick="playAudio()">Play</button>
<button onclick="stopAudio()">Stop</button>
<label>Pan Speed</label>
<input id="speed" type="range" min="0.1" max="3" step="0.1" value="1">
</div>
<script>
const ctx=new (window.AudioContext||window.webkitAudioContext)();
let src,pan,raf,start;
async function playAudio(){
 if(src)return;
 const f=document.getElementById('file').files[0];
 if(!f){alert('Select an audio file');return;}
 const b=await f.arrayBuffer();
 const audio=await ctx.decodeAudioData(b);
 src=ctx.createBufferSource();
 src.buffer=audio;
 pan=ctx.createStereoPanner();
 src.connect(pan).connect(ctx.destination);
 start=ctx.currentTime;
 src.start();
 animate();
 src.onended=()=>cancelAnimationFrame(raf);
}
function animate(){
 pan.pan.value=Math.sin((ctx.currentTime-start)*parseFloat(speed.value));
 raf=requestAnimationFrame(animate);
}
function stopAudio(){
 if(src){try{src.stop()}catch(e){} src=null;}
 cancelAnimationFrame(raf);
}
</script>
</body>
</html>
